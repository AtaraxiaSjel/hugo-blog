<footer class="footer">
    {{- if not site.Params.footer.hideCopyright }}
        {{- if site.Copyright }}
        <span>{{ site.Copyright | markdownify }}</span>
        {{- else }}
        <span>&copy; {{ now.Year }} <a href="{{ "" | absLangURL }}">{{ site.Title }}</a></span>
        {{- end }}
    {{- end }}

    <span>
        <p>
            The content of this site is licensed under
            <a href="http://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.
            The code is licensed under <a href="https://github.com/ataraxiasjel/hugo-blog/LICENSE" target="_blank" rel="noopener noreferrer">MIT</a>.
        </p>
    </span>
</footer>
